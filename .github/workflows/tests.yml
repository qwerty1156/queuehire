name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: challenge
          POSTGRES_PASSWORD: challenge
          POSTGRES_DB: challenge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U challenge -d challenge_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://challenge:challenge@localhost:5432/challenge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
